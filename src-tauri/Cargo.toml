[package]
name = "tirgumim"
version = "0.4.2"
description = "Tirgumim launcher: installs Hebrew translation packs into games"
authors = ["Tirgumim"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tirgumim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
qbsdiff = "1"
tauri-plugin-single-instance = "2"
ed25519-dalek = "2"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
