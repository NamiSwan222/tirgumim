<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: poster:">
  <title>תרגומים</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">ת</span>
      <div>
        <h1>תרגומים</h1>
        <p class="tag">תרגומים עבריים למשחקי מחשב</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="dev-badge" class="dev-badge" hidden>מצב פיתוח</span>
      <input id="search" class="search" type="search" placeholder="חיפוש משחק…" aria-label="חיפוש משחק">
      <button id="reload" class="btn ghost" title="סריקה מחדש של המחשב וטעינת רשימת התרגומים">רענון</button>
      <button id="settings" class="btn ghost" title="הגדרות">הגדרות</button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>

    <section class="section">
      <div class="section-head">
        <h2>התרגומים שלנו</h2>
        <span id="catalog-source" class="muted"></span>
      </div>
      <div id="translations" class="translations" aria-live="polite"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>משחקים במחשב שלך</h2>
        <span id="others-count" class="muted"></span>
      </div>
      <p class="muted small">עדיין אין להם תרגום. אנחנו עובדים על עוד משחקים.</p>
      <div id="others" class="others"></div>
    </section>
  </main>

  <footer class="foot"><span id="version"></span></footer>

  <dialog id="confirm" class="modal">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <button value="ok" class="btn primary" id="confirm-ok">אישור</button>
        <button value="cancel" class="btn ghost">ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dlg" class="modal">
    <form method="dialog">
      <h2>הגדרות</h2>
      <label class="field">
        <span>כתובת רשימת התרגומים ב-GitHub</span>
        <input id="catalog-url" type="url" dir="ltr" placeholder="https://raw.githubusercontent.com/…/catalog.json">
      </label>
      <p class="muted small">השאירו ריק כדי להשתמש בכתובת ברירת המחדל.</p>
      <div class="modal-actions">
        <button value="ok" class="btn primary">שמירה</button>
        <button value="cancel" class="btn ghost">ביטול</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
